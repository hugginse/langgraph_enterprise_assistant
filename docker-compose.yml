services:
  db:
    image: postgres:16
    container_name: lga-postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag123
      POSTGRES_DB: langgraph_enterprise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d langgraph_enterprise"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: lga-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://rag:rag123@db:5432/langgraph_enterprise
      # 容器内访问宿主机 Ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./chroma_data:/app/chroma_data
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
