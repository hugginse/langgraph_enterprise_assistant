[project]
name = "langgraph_enterprise_assistant"
version = "0.1.0"
description = "企业级知识库问答系统（LangGraph Adaptive RAG）"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.18",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "chromadb>=1.0",
    "ollama>=0.4",
    "openai>=1.58",
    "anthropic>=0.40",
    "httpx>=0.28",
    "langgraph>=0.4",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.3.9",
    "langgraph-checkpoint-sqlite>=3.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
